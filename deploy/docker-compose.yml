# Implantação de referência: aplicação + PostgreSQL + Caddy (HTTPS automático com Let's Encrypt).
# Uso: cp ../.env.example .env (preencha), defina DOMINIO e POSTGRES_PASSWORD, depois: docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: formacao
      POSTGRES_USER: formacao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formacao"]
      interval: 10s
      retries: 5

  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://formacao:${POSTGRES_PASSWORD}@db:5432/formacao
      TRUST_PROXY: "true"
      PUBLIC_URL: https://${DOMINIO:?defina DOMINIO}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]

volumes:
  pgdata:
  caddy_data:
